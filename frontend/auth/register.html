<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">
<title>Create Account | Net-Health</title>

<link rel="stylesheet"
href="../css/variables.css">
<link rel="stylesheet"
href="../css/style.css">

</head>

<body>

<section class="auth">
<div class="auth-card">
<h1>Create Account</h1>
<p>
Start your Net-Health journey.
</p>
<form id="register-form">
<input
type="text"
placeholder="Full Name"
required>
<input
type="email"
placeholder="Email Address"
required>
<input
type="password"
placeholder="Password"
required>
<select required>
<option value="">
Select Your Role
</option>
<option>
Student
</option>
<option>
Doctor
</option>
<option>
Nurse
</option>
<option>
Pharmacist
</option>
<option>
Clinical Officer
</option>
<option>
Patient
</option>
<option>
Educator
</option>
</select>

<button
class="btn-primary">

Create Account

</button>

</form>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</section>
  
  <script src="../js/auth.js"></script>

</body>

</html>
