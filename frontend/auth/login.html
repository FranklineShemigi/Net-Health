<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Net-Health</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<section class="auth">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>Sign in to continue to Net-Health.</p>

        <form>

            <input
                type="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                placeholder="Password"
                required>

            <button class="btn-primary">
                Login
            </button>

        </form>

        <p>
            <a href="forgot-password.html">
                Forgot Password?
            </a>
        </p>

        <p>
            Don't have an account?

            <a href="register.html">
                Create Account
            </a>
        </p>

    </div>

</section>

</body>

</html>
